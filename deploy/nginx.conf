# PR7 — TLS at the edge.
#
# The app sets HSTS only when request.url.scheme == "https", so on the old
# port-80-only config that header never fired. Certificates are expected at
# /etc/nginx/certs (mount them; do not bake them into the image).
#
# For a first deploy without a certificate yet, comment out the 443 block and
# the redirect, and uncomment the plain-80 location blocks at the bottom.

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Certbot's HTTP-01 challenge has to stay reachable over plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads are small (JSON set logs); this stops a large body from reaching
  # the app at all.
  client_max_body_size 2m;
  client_body_timeout 15s;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/manifest+json;
  gzip_min_length 512;
  gzip_proxied any;

  # Do not advertise the exact nginx build.
  server_tokens off;

  # ── Security headers, for everything this server returns ─────────────
  #
  # The API set its own, but the HTML and JavaScript the browser actually runs
  # are served from here, and they had none: no clickjacking protection, no
  # CSP. That was nginx's inheritance rule at work — an add_header inside a
  # location discards *every* add_header from the server level, and each
  # location below used to add its own Cache-Control. Caching is therefore
  # set with `expires`, which is not add_header and does not break
  # inheritance. Do not add an add_header to a location without repeating
  # this whole block in it.
  #
  # CSP: scripts only from this origin (the Vite build has no inline script);
  # inline style attributes are allowed because React's style={{}} produces
  # them; Google Fonts is the only third party the page loads. API, media,
  # manifest and service worker are all same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # BEHIND_PROXY=true makes the app read the trusted position in this chain
    # so the auth rate limit sees real client IPs (PR11).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # The API sets these too (useful when it is reached directly in
    # development). Hide its copies so each header appears exactly once.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
  }

  location /media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host $host;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    # Exercise art is immutable and content-addressed by id.
    expires 30d;
  }

  # The PWA shell must never be served stale, or a client can pin itself to an
  # old build that talks to a since-changed API. `expires -1` sends no-cache.
  location = /index.html {
    try_files $uri =404;
    expires -1;
  }

  location = /sw.js {
    try_files $uri =404;
    expires -1;
  }

  # Hashed build output: the name changes whenever the content does.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}

